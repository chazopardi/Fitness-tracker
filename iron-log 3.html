<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="theme-color" content="#0E1217">
<title>Iron Log</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#0E1217;
    --surface:#161C24;
    --surface-2:#1E262F;
    --border:#242E39;
    --text:#E9EEF4;
    --muted:#8896A5;
    --faint:#5C6875;
    --accent:#2FD98A;
    --accent-dim:#123626;
    --amber:#F5B544;
    --rose:#F2705F;
    --info:#6E8BB0;
    --info-dim:#18222E;
    --nav-h:56px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.45; overflow-x:hidden;
    padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  }
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;}

  /* ---------- App shell ---------- */
  .screen{display:none;padding:0 16px 24px;max-width:560px;margin:0 auto;}
  .screen.active{display:block;}
  .topbar{
    position:sticky;top:0;z-index:20;background:rgba(14,18,23,.88);backdrop-filter:blur(12px);
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;margin:0 -16px 4px;
    border-bottom:1px solid var(--border);
  }
  .topbar h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0;}
  .topbar .sub{font-size:13px;color:var(--muted);margin-top:1px;}

  /* ---------- Bottom nav ---------- */
  nav.tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    display:flex;background:rgba(20,25,32,.94);backdrop-filter:blur(16px);
    border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabbar button{
    flex:1;background:none;border:0;color:var(--faint);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    height:var(--nav-h);font-size:10px;font-weight:600;letter-spacing:.01em;
    font-family:inherit;cursor:pointer;transition:color .15s;
  }
  nav.tabbar button svg{width:23px;height:23px;stroke-width:1.9;pointer-events:none;}
  nav.tabbar button.on{color:var(--accent);}

  /* ---------- Cards ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;}
  .sect{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:22px 2px 8px;}
  .sect:first-child{margin-top:6px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .hero-num{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1;}
  .unit{font-size:16px;font-weight:600;color:var(--muted);margin-left:3px;}
  .label{font-size:13px;color:var(--muted);}
  .tiny{font-size:12px;color:var(--faint);}

  /* ---------- Data-sufficiency states ---------- */
  .nodata{
    border:1px dashed var(--border);background:var(--info-dim);border-radius:14px;
    padding:16px;color:var(--muted);font-size:14px;line-height:1.5;
  }
  .nodata strong{display:block;color:var(--text);font-size:15px;font-weight:600;margin-bottom:3px;}
  .baseline-chip{
    display:inline-flex;align-items:center;gap:5px;background:var(--info-dim);color:var(--info);
    border:1px solid #2A3846;border-radius:99px;padding:3px 9px;font-size:11px;font-weight:600;
  }

  /* ---------- Buttons ---------- */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    min-height:52px;border-radius:14px;border:0;font-family:inherit;
    font-size:17px;font-weight:600;cursor:pointer;transition:transform .08s,background .15s;
  }
  .btn:active{transform:scale(.985);}
  .btn-primary{background:var(--accent);color:#06301C;}
  .btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  .btn-sm{min-height:40px;font-size:14px;border-radius:11px;padding:0 14px;width:auto;}
  .btn-danger{background:transparent;color:var(--rose);border:1px solid #3A2422;}

  /* ---------- Inputs ---------- */
  input,select,textarea{
    font-family:inherit;font-size:16px;color:var(--text);
    background:var(--surface-2);border:1px solid var(--border);border-radius:12px;
    padding:12px;width:100%;min-height:48px;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238896A5' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:18px;padding-right:38px;}
  input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.7);}
  label.fld{display:block;font-size:12px;color:var(--muted);margin:0 0 5px 2px;font-weight:500;}

  /* ---------- Stepper ---------- */
  .stepper{display:flex;align-items:stretch;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .stepper button{
    width:46px;flex:0 0 46px;background:transparent;border:0;color:var(--accent);
    font-size:22px;font-weight:500;font-family:inherit;cursor:pointer;
  }
  .stepper button:active{background:var(--accent-dim);}
  .stepper input{
    border:0;border-radius:0;text-align:center;background:transparent;min-height:52px;
    font-size:19px;font-weight:600;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;
    padding:0;min-width:0;
  }
  .stepper input:focus{outline:none;background:var(--accent-dim);}

  /* ---------- Segmented control ---------- */
  .seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px;}
  .seg button{
    flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;color:var(--muted);
    font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
  }
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .seg button.on[data-value="warmup"]{color:var(--amber);}
  .seg button.on[data-value="working"]{color:var(--accent);}

  /* ---------- Pills ---------- */
  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;}
  .pill-ok{background:var(--accent-dim);color:var(--accent);}
  .pill-warn{background:#3A2E12;color:var(--amber);}
  .dot{width:9px;height:9px;border-radius:99px;flex:0 0 9px;}

  /* ---------- Set rows ---------- */
  .setrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border);}
  .setrow:first-child{border-top:0;}
  .setnum{width:22px;flex:0 0 22px;font-size:12px;color:var(--faint);}
  .setmain{flex:1;font-size:15px;font-weight:600;}
  .setdel{width:40px;height:40px;flex:0 0 40px;background:none;border:0;color:var(--faint);font-size:19px;cursor:pointer;}

  /* ---------- Exercise card ---------- */
  .ex{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:12px;overflow:hidden;}
  .ex.done{border-color:#1F3D2E;}
  .ex-head{padding:14px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;}
  .ex-name{font-size:17px;font-weight:650;letter-spacing:-.01em;}
  .ex-body{padding:0 16px 16px;}
  .prev{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .prev span{background:var(--surface-2);border-radius:8px;padding:4px 9px;font-size:13px;color:var(--muted);}
  .target{background:var(--accent-dim);border-radius:11px;padding:10px 12px;margin:12px 0;font-size:14px;color:var(--accent);font-weight:600;}
  .target .t2{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px;}

  /* ---------- Rest timer ---------- */
  .rest{
    position:fixed;left:12px;right:12px;z-index:45;
    bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);
    background:var(--surface-2);border:1px solid #2C4A3C;border-radius:15px;
    padding:11px 14px;display:none;align-items:center;gap:12px;
    box-shadow:0 8px 28px rgba(0,0,0,.5);max-width:536px;margin:0 auto;
  }
  .rest.on{display:flex;}
  .rest-time{font-size:23px;font-weight:700;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;color:var(--accent);min-width:66px;}
  .rest button{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:9px;min-height:38px;padding:0 12px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;}

  /* ---------- Sheet ---------- */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none;}
  .sheet-bg.on{display:block;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);
    border-radius:20px 20px 0 0;border-top:1px solid var(--border);
    padding:8px 16px calc(20px + env(safe-area-inset-bottom));
    max-height:86vh;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;
    max-width:560px;margin:0 auto;
  }
  .sheet.on{transform:translateY(0);}
  .grabber{width:38px;height:4px;background:var(--border);border-radius:99px;margin:6px auto 14px;}
  .sheet h3{margin:0 0 14px;font-size:19px;font-weight:700;}

  .chartbox{position:relative;height:200px;}
  .chartbox.tall{height:260px;}
  .listitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-top:1px solid var(--border);}
  .listitem:first-child{border-top:0;}
  .switch{position:relative;width:50px;height:31px;flex:0 0 50px;}
  .switch input{display:none;}
  .switch .tr{position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--border);border-radius:99px;transition:.2s;}
  .switch .kn{position:absolute;top:4px;left:4px;width:23px;height:23px;background:var(--faint);border-radius:99px;transition:.2s;}
  .switch input:checked + .tr{background:var(--accent-dim);border-color:var(--accent);}
  .switch input:checked + .tr .kn{background:var(--accent);transform:translateX(19px);}

  /* ---------- Boot / storage notice ---------- */
  #boot{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:99;color:var(--faint);font-size:14px;}
  #storage-warn{display:none;margin:0 16px 12px;max-width:560px;}

  /* Narrow iPhones (375px / SE) */
  @media (max-width:380px){
    .screen{padding-left:12px;padding-right:12px;}
    .topbar{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px;}
    .card,.ex-body{padding-left:13px;padding-right:13px;}
    .ex-head{padding-left:13px;padding-right:13px;}
    .stepper button{width:40px;flex:0 0 40px;font-size:20px;}
    .stepper input{font-size:17px;}
    .hero-num{font-size:34px;}
    nav.tabbar button{font-size:9px;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div id="boot">Loading…</div>

<div id="storage-warn" style="margin-left:auto;margin-right:auto">
  <div class="nodata" style="border-color:#4A3A1A;background:#251E10;color:var(--amber)">
    <strong>Storage is limited</strong>
    <span id="storage-warn-text"></span>
  </div>
</div>

<main>
  <section id="s-dashboard" class="screen active"></section>
  <section id="s-workout"   class="screen"></section>
  <section id="s-progress"  class="screen"></section>
  <section id="s-nutrition" class="screen"></section>
  <section id="s-more"      class="screen"></section>
</main>

<div id="rest" class="rest">
  <span class="rest-time" id="rest-time">1:30</span>
  <span class="tiny" style="flex:1">Rest</span>
  <button type="button" data-action="rest-add">+30s</button>
  <button type="button" data-action="rest-skip">Skip</button>
</div>

<nav class="tabbar">
  <button type="button" data-action="go" data-view="dashboard" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Dashboard</button>
  <button type="button" data-action="go" data-view="workout">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>Workout</button>
  <button type="button" data-action="go" data-view="progress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M4 16l5-5 4 3 6-7"/></svg>Progress</button>
  <button type="button" data-action="go" data-view="nutrition">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c4 0 7-3.5 7-8.5S16 4 12 4 5 7.5 5 12.5 8 21 12 21z"/><path d="M12 8v9"/></svg>Nutrition</button>
  <button type="button" data-action="go" data-view="more">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>More</button>
</nav>

<div id="sheet-bg" class="sheet-bg" data-action="close-sheet"></div>
<div id="sheet" class="sheet"><div class="grabber"></div><div id="sheet-body"></div></div>

<script>
(function(){
"use strict";

/* ============================================================
   1. PERSISTENCE LAYER — IndexedDB with graceful degradation
   ------------------------------------------------------------
   Strategy: a write-through in-memory cache backed by IndexedDB.
     • get()  is synchronous  (reads the cache)  -> render stays fast
     • set()  is synchronous  (writes cache) + queues async persist
     • init() is awaited once before the first render
   Tiers: IndexedDB -> localStorage -> in-memory only.
============================================================ */
const Store = (function(){
  const DB_NAME='ironlog', DB_VER=1, STORE='kv', LS_PREFIX='ironlog_';
  const KEYS=['exercise_library','templates','workouts','nutrition_log','nutrition_goals',
              'phase','whoop_recovery','bodyweight_log','body_comp','session','restLen'];

  let db=null;
  let tier='memory';            // 'idb' | 'localStorage' | 'memory'
  const cache=Object.create(null);
  const dirty=new Set();
  let flushTimer=null;

  function hasLS(){
    try{ const k='__il_probe__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
    catch(e){ return false; }
  }

  function openDB(){
    return new Promise(function(resolve){
      if(typeof indexedDB==='undefined'||!indexedDB) return resolve(null);
      let req;
      try{ req=indexedDB.open(DB_NAME,DB_VER); }
      catch(e){ return resolve(null); }
      // iOS Safari in private mode can hang rather than error — bound the wait.
      const guard=setTimeout(function(){ resolve(null); },3000);
      req.onupgradeneeded=function(){
        const d=req.result;
        if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
      };
      req.onsuccess=function(){ clearTimeout(guard); resolve(req.result); };
      req.onerror=function(){ clearTimeout(guard); resolve(null); };
      req.onblocked=function(){ clearTimeout(guard); resolve(null); };
    });
  }

  function idbReadAll(){
    return new Promise(function(resolve){
      if(!db) return resolve(null);
      let tx;
      try{ tx=db.transaction(STORE,'readonly'); }
      catch(e){ return resolve(null); }
      const os=tx.objectStore(STORE), out=Object.create(null);
      let pending=KEYS.length;
      if(!pending) return resolve(out);
      KEYS.forEach(function(k){
        const r=os.get(k);
        r.onsuccess=function(){ if(r.result!==undefined) out[k]=r.result; if(--pending===0) resolve(out); };
        r.onerror=function(){ if(--pending===0) resolve(out); };
      });
      tx.onerror=function(){ resolve(out); };
      tx.onabort=function(){ resolve(out); };
    });
  }

  function idbWrite(keys){
    return new Promise(function(resolve){
      if(!db) return resolve(false);
      let tx;
      try{ tx=db.transaction(STORE,'readwrite'); }
      catch(e){ return resolve(false); }
      const os=tx.objectStore(STORE);
      try{
        keys.forEach(function(k){
          if(cache[k]===undefined) os.delete(k);
          else os.put(cache[k],k);
        });
      }catch(e){ return resolve(false); }
      tx.oncomplete=function(){ resolve(true); };
      tx.onerror=function(){ resolve(false); };
      tx.onabort=function(){ resolve(false); };
    });
  }

  function lsReadAll(){
    const out=Object.create(null);
    if(!hasLS()) return out;
    KEYS.forEach(function(k){
      const raw=localStorage.getItem(LS_PREFIX+k);
      if(raw!=null){ try{ out[k]=JSON.parse(raw); }catch(e){} }
    });
    return out;
  }

  /* Synchronous mirror — the only thing that can run reliably during pagehide. */
  function lsWrite(keys){
    if(!hasLS()) return false;
    let ok=true;
    keys.forEach(function(k){
      try{
        if(cache[k]===undefined) localStorage.removeItem(LS_PREFIX+k);
        else localStorage.setItem(LS_PREFIX+k,JSON.stringify(cache[k]));
      }catch(e){ ok=false; }
    });
    return ok;
  }

  function scheduleFlush(){
    if(flushTimer) clearTimeout(flushTimer);
    flushTimer=setTimeout(function(){ flushTimer=null; flushAsync(); },250);
  }

  async function flushAsync(){
    if(!dirty.size) return;
    const keys=Array.from(dirty);
    dirty.clear();
    if(tier==='idb'){
      const ok=await idbWrite(keys);
      if(!ok) lsWrite(keys);           // fall back rather than silently drop
      else lsWrite(keys);              // keep the sync mirror warm for pagehide
    }else{
      lsWrite(keys);
    }
  }

  /* Called from pagehide/visibilitychange — must be synchronous. */
  function flushSync(){
    if(flushTimer){ clearTimeout(flushTimer); flushTimer=null; }
    if(!dirty.size) return;
    const keys=Array.from(dirty);
    lsWrite(keys);                     // durable enough to survive a tab kill
    idbWrite(keys);                    // best-effort; may or may not complete
    dirty.clear();
  }

  return {
    async init(){
      db=await openDB();
      if(db){
        tier='idb';
        const fromIDB=await idbReadAll();
        const hasIDBData=fromIDB && Object.keys(fromIDB).length>0;
        if(hasIDBData){
          Object.assign(cache,fromIDB);
          // Merge any localStorage keys IDB does not yet know about.
          const ls=lsReadAll();
          Object.keys(ls).forEach(function(k){
            if(cache[k]===undefined){ cache[k]=ls[k]; dirty.add(k); }
          });
        }else{
          // First run on IDB: migrate whatever localStorage already holds.
          const ls=lsReadAll();
          Object.assign(cache,ls);
          Object.keys(ls).forEach(function(k){ dirty.add(k); });
        }
        if(dirty.size) scheduleFlush();
      }else if(hasLS()){
        tier='localStorage';
        Object.assign(cache,lsReadAll());
      }else{
        tier='memory';
      }
      return tier;
    },
    tier(){ return tier; },
    get(key,fallback){
      const v=cache[key];
      return v===undefined?fallback:v;
    },
    set(key,val){
      if(val===undefined||val===null) delete cache[key];
      else cache[key]=val;
      dirty.add(key);
      scheduleFlush();
    },
    remove(key){
      delete cache[key];
      dirty.add(key);
      scheduleFlush();
    },
    flushSync:flushSync,
    flushAsync:flushAsync,
    async clearAll(){
      KEYS.forEach(function(k){ delete cache[k]; });
      if(hasLS()) KEYS.forEach(function(k){ try{ localStorage.removeItem(LS_PREFIX+k); }catch(e){} });
      if(db){
        try{
          const tx=db.transaction(STORE,'readwrite');
          KEYS.forEach(function(k){ tx.objectStore(STORE).delete(k); });
        }catch(e){}
      }
      dirty.clear();
    }
  };
})();

/* Synchronous shims so every existing call site keeps working unchanged. */
function get(k,f){ return Store.get(k,f); }
function set(k,v){ Store.set(k,v); }

/* ============================================================
   CONSTANTS
============================================================ */
const MUSCLES=['Chest','Back','Legs','Shoulders','Arms','Core'];
const CATEGORIES=['Hammer Strength Plate-Loaded','Life Fitness Pin-Loaded','Cables','Free Weights'];
const VOLUME_TARGETS={Chest:{min:8,max:16},Back:{min:10,max:20},Legs:{min:8,max:16},
  Shoulders:{min:8,max:16},Arms:{min:6,max:12},Core:{min:6,max:12}};

const DEFAULT_LIBRARY=[
  {id:'hs-chest',name:'Hammer Strength Chest Press',category:'Hammer Strength Plate-Loaded',muscleGroup:'Chest',repMin:8,repMax:12,inc:2.5,active:true,isCustom:false},
  {id:'hs-row',name:'Hammer Strength Row',category:'Hammer Strength Plate-Loaded',muscleGroup:'Back',repMin:8,repMax:12,inc:2.5,active:true,isCustom:false},
  {id:'hs-shoulder',name:'Hammer Strength Shoulder Press',category:'Hammer Strength Plate-Loaded',muscleGroup:'Shoulders',repMin:8,repMax:12,inc:2.5,active:true,isCustom:false},
  {id:'hs-legpress',name:'Hammer Strength Leg Press',category:'Hammer Strength Plate-Loaded',muscleGroup:'Legs',repMin:10,repMax:15,inc:5,active:true,isCustom:false},

function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
const TODAY=today();
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);}
function e1rm(w,r){return Math.round(w*(1+r/30)*10)/10;}
function ex(id){return S.library.find(function(e){return e.id===id;});}
function fmtDate(s){return new Date(s+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});}

/* ------------------------------------------------------------
   ESCAPING — every dynamic string entering the DOM goes through
   one of these. esc() covers both text nodes and quoted
   attribute values (quotes, angle brackets, ampersand, backtick).
------------------------------------------------------------ */
const ESC_MAP={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;','=':'&#61;'};
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"'`=]/g,function(c){return ESC_MAP[c];});
}
/* Numeric coercion for values interpolated where a number is expected. */
function num(n){ const v=Number(n); return isFinite(v)?v:0; }

/* ============================================================
   DATA SUFFICIENCY
============================================================ */
function trainingData(){
  const w=S.workouts;
  if(!w.length) return {level:'none',sessions:0,days:0};
  const dates=Array.from(new Set(w.map(function(x){return x.date;}))).sort();
  const span=daysBetween(dates[0],TODAY)+1, sessions=dates.length;
  if(sessions<4||span<14) return {level:'building',sessions:sessions,days:span};
  return {level:'sufficient',sessions:sessions,days:span};
}
function weightData(){
  const b=S.bodyweight;
  if(!b.length) return {level:'none',n:0};
  const d=b.map(function(x){return x.date;}).sort();
  const span=daysBetween(d[0],d[d.length-1])+1;
  if(b.length<4||span<14) return {level:'building',n:b.length,days:span};
  return {level:'sufficient',n:b.length,days:span};
}
function recoveryData(){
  if(!S.recovery.length) return {level:'none'};
  const r=S.recovery.filter(function(x){return x.date>=addDays(TODAY,-6);});
  if(!r.length) return {level:'stale'};
  return {level:'sufficient',latest:r.slice().sort(function(a,b){return b.date.localeCompare(a.date);})[0]};
}
function nutritionData(){
  const t=S.log.filter(function(m){return m.date===TODAY;});
  if(!S.log.length) return {level:'none'};
  if(!t.length) return {level:'empty-today'};
  return {level:'sufficient'};
}
function emptyCard(title,body){
  return '<div class="nodata"><strong>'+esc(title)+'</strong>'+esc(body)+'</div>';
}

/* ============================================================
   METRICS
============================================================ */
function workingSets(w){return w.sets.filter(function(s){return s.type==='working';});}
function volumeByMuscle(a,b){
  const c={};
  MUSCLES.forEach(function(m){c[m]=0;});
  S.workouts.forEach(function(w){
    if(w.date>=a&&w.date<=b&&Object.prototype.hasOwnProperty.call(c,w.muscleGroup))
      c[w.muscleGroup]+=workingSets(w).length;
  });
  return c;
}
function rollingAvg(end){
  const a=addDays(end,-6);
  const v=S.bodyweight.filter(function(b){return b.date>=a&&b.date<=end;}).map(function(b){return b.weight;});
  return v.length?v.reduce(function(x,y){return x+y;},0)/v.length:null;
}
function weeklyTrend(){
  const c=rollingAvg(TODAY),p=rollingAvg(addDays(TODAY,-7));
  return (c!=null&&p!=null)?c-p:null;
}
function ffmi(){
  const h=S.bodyComp.heightCm,bf=S.bodyComp.bodyFatPct;
  const l=S.bodyweight.slice().sort(function(a,b){return b.date.localeCompare(a.date);})[0];
  if(!h||bf==null||!l)return null;
  const m=h/100,lean=l.weight*(1-bf/100);
  return lean/(m*m)+6.1*(1.8-m);
}
function lastPerformance(exerciseId,beforeDate){
  const hist=S.workouts.filter(function(w){
    return w.exerciseId===exerciseId&&(!beforeDate||w.date<beforeDate);
  }).sort(function(a,b){return b.date.localeCompare(a.date);});
  return hist[0]||null;
}
function bestSet(w){
  const work=workingSets(w);
  const pool=work.length?work:w.sets;
  return pool.reduce(function(b,s){
    return (!b||e1rm(s.weight,s.reps)>e1rm(b.weight,b.reps))?s:b;
  },pool[0]);
}
function prsThisWeek(){
  const wk=addDays(TODAY,-6);let n=0;
  const byEx={};
  S.workouts.forEach(function(w){(byEx[w.exerciseId]=byEx[w.exerciseId]||[]).push(w);});
  Object.keys(byEx).forEach(function(k){
    const sorted=byEx[k].slice().sort(function(a,b){return a.date.localeCompare(b.date);});
    let best=0;
    sorted.forEach(function(w){if(w.bestOneRM>best){best=w.bestOneRM;if(w.date>=wk)n++;}});
  });
  return n;
}
function ragStatus(g,sets){
  const t=VOLUME_TARGETS[g];
  if(sets<t.min)return 'bad';
  if(sets<=t.max)return 'ok';
  if(sets<=t.max*1.3)return 'warn';
  return 'bad';
}
function nextTemplate(){
  if(!S.templates.length)return null;
  const last=S.workouts.length?S.workouts.slice().sort(function(a,b){return b.date.localeCompare(a.date);})[0]:null;
  if(!last||!last.templateId)return S.templates[0];
  const i=S.templates.findIndex(function(t){return t.id===last.templateId;});
  return S.templates[(i+1)%S.templates.length]||S.templates[0];
}

function bar(v,goal,col){

  return '<div style="height:7px;background:var(--surface-2);border-radius:99px;margin-top:9px;overflow:hidden">'+
    '<div style="height:100%;width:'+num(pct)+'%;background:'+(over?'var(--amber)':col)+';border-radius:99px;transition:width .5s"></div></div>';
}

function recommendations(td,wd,rd){
  const out=[];
  if(td.level==='none'){
    out.push('Complete your first workout — training recommendations begin once sessions are logged.');
  }else if(td.level==='building'){
    out.push('Keep logging — '+td.sessions+' session'+(td.sessions===1?'':'s')+' so far. Volume guidance unlocks at roughly two weeks.');
  }else{
    const c=volumeByMuscle(addDays(TODAY,-6),TODAY);
    MUSCLES.forEach(function(m){
      if(c[m]<VOLUME_TARGETS[m].min)
        out.push(m+' is below target this week ('+c[m]+' of '+VOLUME_TARGETS[m].min+' sets) — add 1–2 sets.');
      else if(c[m]>VOLUME_TARGETS[m].max*1.3)
        out.push(m+' volume is high ('+c[m]+' sets) — consider pulling back to allow recovery.');
    });
  }
  if(wd.level==='sufficient'){
    const t=weeklyTrend();
    if(t!=null){
      if(S.phase==='Lean Gain'&&t<=0) out.push('Weight is not rising on Lean Gain — consider +150 kcal/day.');
      if(S.phase==='Cut'&&t>=0) out.push('Weight is not falling on Cut — consider −150 kcal/day.');
    }
  }else if(wd.level==='building'){
    out.push('Keep weighing in — calorie guidance needs about two weeks of data.');
  }
  if(rd.level==='sufficient'&&rd.latest.score<34)
    out.push('Recovery is low ('+rd.latest.score+'%) — keep today light.');
  if(!out.length) out.push('Everything is on target. Keep the current plan going.');
  return out.slice(0,4);
}

function elapsed(ts){
  if(!ts)return '';
  const m=Math.floor((Date.now()-ts)/6e4);
  return m<60?m+' min':Math.floor(m/60)+'h '+(m%60)+'m';
}

function exerciseCard(r,i){
  const e=ex(r.exerciseId);
  if(!e)return '';
  const prev=lastPerformance(r.exerciseId,S.session.date);
  const open=r.open!==false;
  const work=r.sets.filter(function(s){return s.type==='working';});
  const complete=work.length>=3;

  let h='<div class="ex '+(complete?'done':'')+'">'+
    '<div class="ex-head" data-action="toggle-ex" data-index="'+num(i)+'">'+
      '<div style="flex:1;min-width:0">'+
        '<div class="ex-name">'+esc(e.name)+'</div>'+
        '<div class="tiny mono">'+num(r.sets.length)+' logged · target '+num(e.repMin)+'–'+num(e.repMax)+' reps</div>'+
      '</div>'+
      (complete?'<span class="pill pill-ok">Done</span>':'')+
      '<span style="color:var(--faint);font-size:13px">'+(open?'▾':'▸')+'</span>'+
    '</div>';

  if(!open)return h+'</div>';
  h+='<div class="ex-body">';

  if(prev){
    const pw=prev.sets.filter(function(s){return s.type==='working';});
    h+='<div class="tiny" style="margin-top:2px">Previous · '+esc(fmtDate(prev.date))+'</div>'+
       '<div class="prev">'+(pw.length?pw.map(function(s){
         return '<span class="mono">'+num(s.weight)+' × '+num(s.reps)+'</span>';
       }).join(''):'<span class="mono">warm-up only</span>')+'</div>';
  }else{
    h+='<div class="tiny" style="margin-top:6px;color:var(--info)">First time logging this exercise — no previous data.</div>';
  }

  const tgt=nextTarget(r,e,prev);
  h+='<div class="target">'+(tgt.weight!=null?num(tgt.weight)+'kg × ':'')+num(e.repMin)+'–'+num(e.repMax)+' reps'+
     '<span class="t2">'+esc(tgt.note)+'</span></div>';

  if(r.sets.length){
    h+='<div style="margin-bottom:14px">'+r.sets.map(function(s,si){
      return '<div class="setrow">'+
        '<span class="setnum mono">'+num(si+1)+'</span>'+
        '<span class="pill '+(s.type==='warmup'?'pill-warn':'pill-ok')+'" style="font-size:10px">'+(s.type==='warmup'?'W':'Work')+'</span>'+
        '<span class="setmain mono">'+num(s.weight)+'kg × '+num(s.reps)+
          '<span class="tiny" style="margin-left:7px">RIR '+num(s.rir)+'</span></span>'+
        '<button type="button" class="setdel" data-action="remove-set" data-index="'+num(i)+'" data-set="'+num(si)+'" aria-label="Remove set">×</button>'+
      '</div>';
    }).join('')+'</div>';
  }

  const d=r.draft;
  h+='<div class="seg" style="margin-bottom:10px">'+
       '<button type="button" class="'+(d.type==='warmup'?'on':'')+'" data-action="set-type" data-index="'+num(i)+'" data-value="warmup">Warm-up</button>'+
       '<button type="button" class="'+(d.type==='working'?'on':'')+'" data-action="set-type" data-index="'+num(i)+'" data-value="working">Working set</button>'+
     '</div>'+
     '<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">'+
       '<div><label class="fld">Weight (kg)</label>'+stepper(i,'weight',d.weight,e.inc)+'</div>'+
       '<div><label class="fld">Reps</label>'+stepper(i,'reps',d.reps,1)+'</div>'+
     '</div>'+
     '<div style="margin-top:9px"><label class="fld">Reps in reserve</label>'+stepper(i,'rir',d.rir,1)+'</div>'+
     '<button type="button" class="btn btn-primary" style="margin-top:14px" data-action="log-set" data-index="'+num(i)+'">Log set</button>'+
     '<div style="display:flex;gap:8px;margin-top:10px">'+
       '<button type="button" class="btn btn-ghost btn-sm" style="flex:1" data-action="substitute" data-index="'+num(i)+'">Swap</button>'+
       '<button type="button" class="btn btn-ghost btn-sm" style="flex:1" data-action="notes" data-index="'+num(i)+'">Notes'+(r.note?' •':'')+'</button>'+
       '<button type="button" class="btn btn-ghost btn-sm" style="flex:1" data-action="remove-exercise" data-index="'+num(i)+'">Remove</button>'+
     '</div>';
  return h+'</div></div>';
}

function stepper(i,field,val,step){
  return '<div class="stepper">'+
    '<button type="button" data-action="bump" data-index="'+num(i)+'" data-field="'+esc(field)+'" data-step="'+num(-step)+'">−</button>'+
    '<input type="number" inputmode="decimal" value="'+num(val)+'" '+
      'data-action="draft-input" data-index="'+num(i)+'" data-field="'+esc(field)+'">'+
    '<button type="button" data-action="bump" data-index="'+num(i)+'" data-field="'+esc(field)+'" data-step="'+num(step)+'">+</button></div>';
}

function nextTarget(r,e,prev){
  const done=r.sets.filter(function(s){return s.type==='working';});
  if(done.length){
    const last=done[done.length-1];
    if(last.reps>=e.repMax&&last.rir>=2)
      return {weight:last.weight+e.inc,note:'Hit '+last.reps+' at RIR '+last.rir+' — add '+e.inc+'kg.'};
    if(last.reps<e.repMin)
      return {weight:last.weight,note:'Below '+e.repMin+' reps — hold this weight.'};
    return {weight:last.weight,note:'Match or beat '+last.reps+' reps at 1–2 RIR.'};
  }
  if(prev){
    const pw=prev.sets.filter(function(s){return s.type==='working';});
    if(pw.length){
      const top=pw[0];
      if(prev.increaseWeight) return {weight:top.weight+e.inc,note:'Hit target last session — add '+e.inc+'kg today.'};
      return {weight:top.weight,note:'Match '+top.reps+' reps from last session at 1–2 RIR.'};
    }
  }
  return {weight:null,note:'No history — pick a weight you can control for the rep range.'};
}

function drawWeight(){

function storageLabel(){
  const t=Store.tier();
  if(t==='idb') return 'IndexedDB (durable)';
  if(t==='localStorage') return 'localStorage (fallback)';
  return 'In-memory (not saved)';
}

/* ============================================================
   REST TIMER
============================================================ */
let restLeft=0,restInt=null;
function startRest(sec){
  restLeft=sec;
  document.getElementById('rest').classList.add('on');
  paintRest();
  clearInterval(restInt);
  restInt=setInterval(function(){
    restLeft--;paintRest();
    if(restLeft<=0){clearInterval(restInt);stopRest();if(navigator.vibrate)navigator.vibrate([200,80,200]);}
  },1000);
}
function paintRest(){
  const m=Math.floor(Math.max(0,restLeft)/60),s=Math.max(0,restLeft)%60;
  document.getElementById('rest-time').textContent=m+':'+String(s).padStart(2,'0');
}
function stopRest(){clearInterval(restInt);document.getElementById('rest').classList.remove('on');}

/* ============================================================
   HELPERS
============================================================ */
function newRow(id){
  const e=ex(id);
  const prev=lastPerformance(id,TODAY);
  let w=0;
  if(prev){
    const pw=prev.sets.filter(function(s){return s.type==='working';});
    if(pw.length)w=prev.increaseWeight?pw[0].weight+e.inc:pw[0].weight;
  }
  return {rowId:uid(),exerciseId:id,sets:[],note:'',open:true,
    draft:{type:w?'warmup':'working',weight:w?Math.round(w*0.5/e.inc)*e.inc:0,reps:e.repMax,rir:2}};
}
function persistAll(){
  set('exercise_library',S.library);set('templates',S.templates);set('workouts',S.workouts);
  set('nutrition_log',S.log);set('nutrition_goals',S.goals);set('phase',S.phase);
  set('whoop_recovery',S.recovery);set('bodyweight_log',S.bodyweight);set('body_comp',S.bodyComp);
  set('session',S.session);set('restLen',S.restLen);
}
function migrateLibrary(lib){
  return lib.map(function(e){
    if(e.repMin==null||e.repMax==null){
      const t=e.targetReps||10;
      e.repMin=Math.max(1,t-2);e.repMax=t+2;
    }
    if(e.inc==null)e.inc=2.5;
    return e;
  });
}

    const s=S.session;
    const valid=s.rows.filter(function(r){
      return r.sets.some(function(x){return x.weight>0&&x.reps>0;});
    });
    if(!valid.length){
      if(!confirm('No sets were logged. Discard this session?'))return;
      S.session=null;set('session',null);render();return;
    }
    valid.forEach(function(r){

      const work=sets.filter(function(x){return x.type==='working';});
      const pool=work.length?work:sets;
      const best=pool.reduce(function(b,x){
        const rm=e1rm(x.weight,x.reps);

      },null);
      S.workouts.push({id:uid(),date:s.date,templateId:s.templateId,templateName:s.name,

        increaseWeight:work.length>0&&work.every(function(x){return x.reps>=e.repMax&&x.rir>=2;})});
    });

      return {date:addDays(TODAY,-(6-i)),score:s};
    });
    S.log=[['LIDL Birchwood Raw Chicken Breast',220],['Basmati Rice (dry)',140],['Broccoli (raw)',200],
      ['LIDL High Protein Yogurt (Vanilla)',250],['Oats (dry)',80],['Banana (raw)',120]]
      .map(function(a){
        const p=LIDL_DB[a[0]],f=a[1]/100;
        return {id:uid(),date:TODAY,meal:a[0],grams:a[1],calories:Math.round(p.cal*f),
          protein:Math.round(p.protein*f*10)/10,carbs:Math.round(p.carbs*f*10)/10,
          fat:Math.round(p.fat*f*10)/10};
      });
    S.goals={calories:2850,protein:165,carbs:300,fat:80};
    S.phase='Cut';S.bodyComp={heightCm:178,bodyFatPct:15.5};S.session=null;
    persistAll();go('dashboard');
  }
};

const ChangeActions={
  'draft-input':function(el){
    const i=+el.dataset.index, f=el.dataset.field;
    const d=S.session.rows[i].draft;
    d[f]=Math.max(0,parseFloat(el.value)||0);
    set('session',S.session);renderWorkout();
  },
  'progression-select':function(el){ drawProgression(el.value); },
  'toggle-lib':function(el){
    const e=ex(el.dataset.id);
    if(e){ e.active=el.checked; set('exercise_library',S.library); }
  },
  'import':function(el){
    const f=el.files&&el.files[0];
    if(!f)return;
    const reader=new FileReader();
    reader.onload=function(ev){
      try{
        const d=JSON.parse(ev.target.result);
        if(!d||!Array.isArray(d.workouts)||!Array.isArray(d.library))
          throw new Error('Missing expected fields');
        if(!confirm('Replace all current data with this backup?'))return;
        S.library=migrateLibrary(d.library);
        S.templates=Array.isArray(d.templates)?d.templates:[];
        S.workouts=d.workouts.filter(function(w){return w&&Array.isArray(w.sets);});
        S.log=Array.isArray(d.log)?d.log:[];
        S.goals=d.goals||S.goals;
        S.phase=d.phase||'Maintain';
        S.recovery=Array.isArray(d.recovery)?d.recovery:[];
        S.bodyweight=Array.isArray(d.bodyweight)?d.bodyweight:[];
        S.bodyComp=d.bodyComp||{heightCm:null,bodyFatPct:null};
        persistAll();render();alert('Backup restored.');
      }catch(err){ alert('Could not read that file: '+err.message); }
      el.value='';
    };
    reader.readAsText(f);
  }
};

document.body.addEventListener('click',function(ev){
  const el=ev.target.closest('[data-action]');
  if(!el)return;
  // Inputs and selects handle themselves via the change listener.
  if(el.tagName==='INPUT'&&el.type!=='button')return;
  if(el.tagName==='SELECT')return;
  const fn=ClickActions[el.dataset.action];
  if(!fn)return;
  ev.preventDefault();
  try{ fn(el); }
  catch(err){ console.error('action "'+el.dataset.action+'" failed:',err); }
});

document.body.addEventListener('change',function(ev){
  const el=ev.target.closest('[data-action]');
  if(!el)return;
  const fn=ChangeActions[el.dataset.action];
  if(!fn)return;
  try{ fn(el); }
  catch(err){ console.error('change "'+el.dataset.action+'" failed:',err); }
});

/* ============================================================
   3. CRASH / TAB-CLOSE STATE SYNC
   pagehide is the reliable one on iOS Safari (beforeunload is
   unreliable there); visibilitychange covers app-switching.
============================================================ */
function syncNow(){
  if(S.session) set('session',S.session);
  Store.flushSync();
}
window.addEventListener('pagehide',syncNow);
window.addEventListener('beforeunload',syncNow);
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden') syncNow();
});
/* Periodic safety net while a workout is in progress. */
setInterval(function(){ if(S.session) Store.flushAsync(); },20000);

/* ============================================================
   INIT — storage resolves before the first render
============================================================ */
(async function init(){
  let tier='memory';
  try{ tier=await Store.init(); }
  catch(e){ console.error('storage init failed',e); }

  S.library=migrateLibrary(get('exercise_library',DEFAULT_LIBRARY));
  S.templates=get('templates',[]);
  S.workouts=get('workouts',[]).filter(function(w){return w&&Array.isArray(w.sets);});
  S.log=get('nutrition_log',[]);
  S.goals=get('nutrition_goals',S.goals);
  S.phase=get('phase','Maintain');
  S.recovery=get('whoop_recovery',[]);
  S.bodyweight=get('bodyweight_log',[]);
  S.bodyComp=get('body_comp',S.bodyComp);
  S.session=get('session',null);
  S.restLen=get('restLen',90);
  if(S.session&&S.session.date!==TODAY)S.session=null;

  if(tier!=='idb'){
    const warn=document.getElementById('storage-warn');
    document.getElementById('storage-warn-text').textContent = tier==='localStorage'
      ? 'IndexedDB is unavailable, so Iron Log is using localStorage. Your data is saved but is more likely to be cleared by the browser — export a backup regularly.'
      : 'No persistent storage is available (private browsing?). Data will be lost when you close this tab.';
    warn.style.display='block';
  }

  document.getElementById('boot').remove();
  render();
})();
})();
</script>
